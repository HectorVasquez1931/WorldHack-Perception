<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>WorldHack: Perception</title>
    <link rel="icon" href="/WorldHack-Perception-frontend/assets/img/Isologo Juego.png" type="image/png">
    <!-- ===== BOOTSTRAP ===== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ===== CSS BASE ===== -->
    <link rel="stylesheet" href="styles.css">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- ===== AOS (ANIMACIONES SCROLL) ===== -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>


</head>

<body>
    <main class="page-avatar d-flex justify-content-center align-items-center vh-100">

        <div class="container-fluid">

            <p id="typed-AVATAR" class="title display-4"></p>
            <p class="subtext small">Seleccionar una opción por campo predefinido para permitir pasar a la siguiente
                pantalla.</p>

            <!-- Fila 2 -->
            <div class="row justify-content-center">
                <div class="col-12">
                    <div class="form-box">
                        <form id="player-form">
                            <div class="row justify-content-center gap-4">
                                <div class="col-12 col-md-4 col-lg-3">
                                    
                                    <!-- COLUMNA IZQUIERDA -->
                                    <p class="subtitle fs-3">Género</p>

                                    <label class="option">
                                        <input type="radio" name="genero" value="Masculino">
                                        <span></span> Masculino
                                    </label>

                                    <label class="option">
                                        <input type="radio" name="genero" value="Femenino">
                                        <span></span> Femenino
                                    </label>

                                    <label class="option">
                                        <input type="radio" name="genero" value="Andrógeno">
                                        <span></span> Andrógeno
                                    </label>

                                    <p class="subtitle fs-3">Forma de Ojos</p>

                                    <label class="option">
                                        <input type="radio" name="formaOjos" value="Rasgados">
                                        <span></span> Rasgados
                                    </label>

                                    <label class="option">
                                        <input type="radio" name="formaOjos" value="Redondos">
                                        <span></span> Redondos
                                    </label>

                                    <label class="option">
                                        <input type="radio" name="formaOjos" value="Grandes">
                                        <span></span> Grandes
                                    </label>

                                    <div class="buttons fs-4">
                                        <button id="skip-btn" type="button">OMITIR</button>
                                    </div>
                                </div>

                                <div class="col-12 col-md-4 col-lg-3 gap-4">
                                    <!--COLUMNA DERECHA-->
                                    <p class="subtitle fs-3">Tono de Piel</p>

                                    <label class="option">
                                        <input type="radio" name="tonoPiel" value="Pálida">
                                        <span></span> Pálida
                                    </label>

                                    <label class="option">
                                        <input type="radio" name="tonoPiel" value="Bronceada">
                                        <span></span> Bronceada
                                    </label>

                                    <label class="option">
                                        <input type="radio" name="tonoPiel" value="Oscura">
                                        <span></span> Oscura
                                    </label>

                                    <p class="subtitle fs-3">Color de Ojos</p>

                                    <div class="ojos-grid">
                                        <label class="option">
                                            <input type="radio" name="colorOjos" value="Azul">
                                            <span></span> Azul
                                        </label>

                                        <label class="option">
                                            <input type="radio" name="colorOjos" value="Café">
                                            <span></span> Café
                                        </label>

                                        <label class="option">
                                            <input type="radio" name="colorOjos" value="Verde">
                                            <span></span> Verde
                                        </label>

                                        <label class="option">
                                            <input type="radio" name="colorOjos" value="Negro">
                                            <span></span> Negro
                                        </label>

                                        <label class="option">
                                            <input type="radio" name="colorOjos" value="Gris">
                                            <span></span> Gris
                                        </label>

                                        <label class="option">
                                            <input type="radio" name="colorOjos" value="Ámbar">
                                            <span></span> Ámbar
                                        </label>
                                    </div>

                                    <div class="buttons fs-4">
                                        <button id="btn-siguiente" type="submit">SIGUIENTE</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
    </main>

    <script src="/WorldHack-Perception-frontend/js/form1/formulario.js"></script>
    <script src="/WorldHack-Perception-frontend/js/form1/animaciones.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <script src="/WorldHack-Perception-frontend/js/webfonts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <script src="/WorldHack-Perception-frontend/js/typed.js"></script>

</body>

</html>
