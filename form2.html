<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>WorldHack: Perception</title>
    <link rel="icon" href="/WorldHack-Perception-frontend/assets/img/Isologo Juego.png" type="image/png">
    <!-- ===== BOOTSTRAP ===== -->/
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ===== CSS BASE ===== -->
    <link rel="stylesheet" href="styles.css">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">



    <!-- ===== AOS (ANIMACIONES SCROLL) ===== -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>


</head>

<body>
    <main class="d-flex justify-content-center align-items-center vh-100">

        <div class="container-fluid">

            <div class="row justify-content-center">

                <div class="row justify-content-center">
                    <div class="col-12">
                        <p id="typed-AVATAR" class="title display-4"></p>
                    </div>
                </div>

                <div class="row justify-content-center mt-2">

                    <div class="col-12 col-md-8">
                        <form id="player-form" autocomplete="off">

                            <div class="form-open">

                                <div class="input-group floating fs-5">
                                    <input type="text" name="cabello" placeholder="ej. cabello corto de color café.">
                                    <label>Cabello:</label>
                                </div>

                                <div class="input-group floating fs-5">
                                    <input type="text" name="rasgosPiel" placeholder="ej. cicatrices y pecas.">
                                    <label>Rasgos Distintivos:</label>
                                </div>

                                <div class="input-group floating fs-5">
                                    <input type="text" name="accesorioCabeza" placeholder="ej. gorra de Pokémon.">
                                    <label>Accesorios en la Cabeza:</label>
                                </div>


                                <div class="input-group floating fs-5">
                                    <input type="text" name="ropa" placeholder="ej. camisa de Kirby.">
                                    <label>Ropa:</label>
                                </div>

                                <div class="input-group floating fs-5">
                                    <input type="text" name="otro"
                                        placeholder="ej. quiero que mi personaje tenga bigote.">
                                    <label>Otros:</label>
                                </div>

                            </div>
                            <button class="btn-create fs-4">CREAR</button>

                        </form>


                    </div>
                </div>
            </div>
        </div>
    </main>


    <script src="/WorldHack-Perception-frontend/js/form2/formulario.js"></script>
    <script src="/WorldHack-Perception-frontend/js/form2/animaciones.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <script src="/WorldHack-Perception-frontend/js/webfonts.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <script src="/WorldHack-Perception-frontend/js/typed.js"></script>

</body>

</html>
