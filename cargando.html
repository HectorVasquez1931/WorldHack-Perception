<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>WorldHack: Perception</title>
    <link rel="icon" href="/WorldHack-Perception-frontend/assets/img/Isologo Juego.png" type="image/png">
    <!-- ===== BOOTSTRAP ===== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ===== CSS BASE ===== -->
    <link rel="stylesheet" href="styles.css">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


    <!-- ===== AOS (ANIMACIONES SCROLL) ===== -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

<body>
    <main class="d-flex justify-content-center align-items-center vh-100">

        <div class="container-fluid">

            <div class="row justify-content-center">
                <div class="col-12">
                    <p id="typed-PROGRESO" class="title display-4"></p>
                </div>
            </div>

            <div class="row justify-content-center">

                <div class="col-12 col-md-8">

                    <div class="loading-screen">

                        <div class="progress-bar-container">
                            <div class="segment-big"></div>
                            <div class="segment-big"></div>
                            <div class="segment-big"></div>
                            <div class="segment"></div>
                        </div>

                        <div class="status-container">
                            <p class="step-text fs-3">Paso <span id="step-num">1</span>/3</p>
                            <p class="desc-text fs-5" id="status-msg">Generando avatar...</p>
                        </div>

                        <p class="tips small"></p>

                    </div>

                </div>

            </div>
        </div>
    </main>


    <script src="/WorldHack-Perception-frontend/js/cargando/animaciones.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
